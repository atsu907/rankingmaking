<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>勉強時間ランキング作成</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: "Helvetica Neue", Arial, sans-serif;
  padding: 20px;
  background: #f5f5f7;
}
textarea {
  width: 100%;
  height: 200px;
  margin-top: 10px;
}
button {
  padding: 10px 20px;
  margin: 10px 0;
  font-size: 16px;
}
#resultText {
  white-space: pre-wrap;
  background: #fff;
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h2>勉強時間ランキング作成</h2>

<button id="fileBtn">ファイルを選択</button>
<span id="fileName"></span>
<input type="file" id="fileInput" style="display:none">

<br><br>

<label>ログ入力：</label>
<textarea id="logInput"></textarea>

<br>

<label>対象日：</label>
<input type="date" id="targetDate">

<br><br>

<button id="calcBtn">ランキング作成</button>
<button id="copyBtn">コピー</button>
<span id="copyMsg" style="display:none;">コピーしました！</span>

<pre id="resultText"></pre>

<!-- キャッシュ対策として ?v=20240603 を付与 -->
<script src="script.js?v=20240603"></script>

</body>
</html>
