<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>勉強時間ランキング作成</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1 class="title">勉強時間ランキング作成</h1>

    <div class="card">
      <label class="label">対象日</label>
      <input type="date" id="targetDate" class="input">

      <label class="label">テキストファイルを読み込む</label>
      <input type="file" id="fileInput" accept=".txt" class="input">

      <label class="label">または直接コピペ</label>
      <textarea id="logInput" rows="10" class="textarea"></textarea>

      <button id="calcBtn" class="button">ランキング作成</button>
    </div>

    <div class="card result-card">
      <div class="result-header">
        <span class="result-title">結果</span>
        <button id="copyBtn" class="copy-btn">コピー</button>
      </div>
      <pre id="resultText" class="result"></pre>
      <span id="copyMsg" class="copy-msg">コピーしました！</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
