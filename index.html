<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>勉強時間ランキング作成</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; }
    textarea { width: 100%; box-sizing: border-box; }
    input, button { font-size: 14px; }
    button { padding: 6px 12px; margin-top: 8px; }
    pre {
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      background: #f7f7f7;
      padding: 12px;
      border-radius: 6px;
    }
    #copyMsg {
      color: green;
      font-size: 14px;
      margin-left: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>勉強時間ランキング作成</h1>

  <p>
    <label>対象日：
      <input type="date" id="targetDate">
    </label>
  </p>

  <p><strong>① テキキストファイルを読み込む：</strong></p>
  <input type="file" id="fileInput" accept=".txt">
  <br><br>

  <p><strong>② または直接コピペ：</strong></p>
  <textarea id="logInput" rows="14" placeholder="ここにLINEログを貼り付けてもOK"></textarea>

  <p>
    <button id="calcBtn">ランキング作成</button>
  </p>

  <h2>結果</h2>

  <button id="copyBtn">コピー</button>
  <span id="copyMsg">コピーしました！</span>

  <pre id="resultText"></pre>

  <script>
    // ファイル読み込み
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        document.getElementById('logInput').value = event.target.result;
      };
      reader.readAsText(file, 'UTF-8');
    });

    // ログ解析（全期間）
    function parseAllLogs(rawText) {
      const lines = rawText.split('\n').map(l => l.trim());

      let currentLogDate = null;
      const allReports = [];

      const dateLineRegex = /^(\d{4})\.(\d{2})\.(\d{2})/;
      const timeRegex = /(\d+)\s*時間(?:\s*(\d+)\s*分)?/;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // 日付行
        const d = line.match(dateLineRegex);
        if (d) {
          const y = d[1], m = d[2], day = d[3];
          currentLogDate = `${y}-${m}-${day}`;
          continue;
        }
        if (!currentLogDate) continue;

        // 勉強時間報告
        const m = line.match(/^(\d{1,2}):(\d{2})\s+(.+?)\s+勉強時間報告/);
        if (!m) continue;

        const hour = Number(m[1]);
        const minute = Number(m[2]);
        const name = m[3].trim();

        let msgDate = new Date(`${currentLogDate}T00:00:00`);
        msgDate.setHours(hour, minute, 0, 0);

        const hasSchool = line.includes("学校あり");
        const hasExam = line.includes("受験生");

        const timeMatch = line.match(timeRegex);
        if (timeMatch) {
          const h = Number(timeMatch[1]);
          const m2 = timeMatch[2] ? Number(timeMatch[2]) : 0;
          const total = h * 60 + m2;

          allReports.push({
            name,
            minutes: total,
            date: msgDate,
            school: hasSchool,
            exam: hasExam
          });
        } else {
          if (i + 1 < lines.length) {
            const nextLine = lines[i + 1];
            const t = nextLine.match(timeRegex);
            if (t) {
              const h = Number(t[1]);
              const m2 = t[2] ? Number(t[2]) : 0;
              const total = h * 60 + m2;

              allReports.push({
                name,
                minutes: total,
                date: msgDate,
                school: hasSchool,
                exam: hasExam
              });
              i++;
            }
          }
        }
      }

      return allReports;
    }

    // 指定日の日次範囲
    function getDailyRange(targetDateStr) {
      const start = new Date(`${targetDateStr}T12:00:00`);
      const end = new Date(start);
      end.setDate(end.getDate() + 1);
      end.setHours(6, 0, 0, 0);
      return { start, end };
    }

    // 月初〜当日までの全日次期間
    function getMonthlyRanges(targetDateStr) {
      const target = new Date(`${targetDateStr}T00:00:00`);
      const year = target.getFullYear();
      const month = target.getMonth();

      const ranges = [];

      for (let day = 1; day <= target.getDate(); day++) {
        const d = new Date(year, month, day);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");

        ranges.push(getDailyRange(`${yyyy}-${mm}-${dd}`));
      }

      return ranges;
    }

    // ボタン押下
    document.getElementById('calcBtn').addEventListener('click', () => {
      const raw = document.getElementById('logInput').value;
      const targetDateStr = document.getElementById('targetDate').value;

      if (!raw.trim()) {
        alert('ログを入力するか、ファイルを読み込んでください');
        return;
      }
      if (!targetDateStr) {
        alert('対象日を選択してください');
        return;
      }

      const allReports = parseAllLogs(raw);

      // 当日の日次範囲
      const { start, end } = getDailyRange(targetDateStr);

      // 当日報告（最新のみ）
      const latestToday = {};
      allReports.forEach(r => {
        if (r.date >= start && r.date <= end) {
          latestToday[r.name] = r;
        }
      });

      const todayEntries = Object.values(latestToday).sort((a, b) => b.minutes - a.minutes);

      // 月次範囲
      const monthlyRanges = getMonthlyRanges(targetDateStr);

      // 月次合計（1日1回だけ）
      const monthlyTotals = {};

      monthlyRanges.forEach(range => {
        const daily = {};

        // その日の報告を全部集める
        allReports.forEach(r => {
          if (r.date >= range.start && r.date <= range.end) {
            daily[r.name] = r; // 上書きで最新だけ残る
          }
        });

        // 当日報告していない人は除外
        for (const name in daily) {
          if (!latestToday[name]) continue;

          monthlyTotals[name] = (monthlyTotals[name] || 0) + daily[name].minutes;
        }
      });

      // 日付フォーマット（6/24）
      const d = new Date(targetDateStr);
      const dateLabel = `${d.getMonth() + 1}/${d.getDate()}`;

      // 表示テキスト
      let text = "";

      // 総合ランキング（必ず表示）
      text += `総合ランキング ${dateLabel}\n`;
      todayEntries.forEach((r, i) => {
        const h = Math.floor(r.minutes / 60);
        const m = r.minutes % 60;
        const monthH = Math.floor((monthlyTotals[r.name] || 0) / 60);

        text += `${i + 1}位 ${r.name}：${h}時間${m}分\n`;
        text += `今月合計 ${monthH}h\n`;
      });

      text += "\n";

      // 学校あり
      const school = todayEntries.filter(r => r.school);
      if (school.length > 0) {
        text += "学校ありランキング\n";
        school.forEach((r, i) => {
          const h = Math.floor(r.minutes / 60);
          const m = r.minutes % 60;
          const monthH = Math.floor((monthlyTotals[r.name] || 0) / 60);

          text += `${i + 1}位 ${r.name}：${h}時間${m}分\n`;
          text += `今月合計 ${monthH}h\n`;
        });
        text += "\n";
      }

      // 受験生
      const exam = todayEntries.filter(r => r.exam);
      if (exam.length > 0) {
        text += "受験生ランキング\n";
        exam.forEach((r, i) => {
          const h = Math.floor(r.minutes / 60);
          const m = r.minutes % 60;
          const monthH = Math.floor((monthlyTotals[r.name] || 0) / 60);

          text += `${i + 1}位 ${r.name}：${h}時間${m}分\n`;
          text += `今月合計 ${monthH}h\n`;
        });
      }

      document.getElementById('resultText').textContent = text;
    });

    // コピー機能
    document.getElementById('copyBtn').addEventListener('click', () => {
      const text = document.getElementById('resultText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const msg = document.getElementById('copyMsg');
        msg.style.display = "inline";
        setTimeout(() => msg.style.display = "none", 1500);
      });
    });
  </script>
</body>
</html>
