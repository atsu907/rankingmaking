<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>勉強時間ランキング作成</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css?v=20240605">
</head>

<body>

<h2>勉強時間ランキング作成</h2>

<button id="fileBtn">ファイルを選択</button>
<span id="fileName"></span>
<input type="file" id="fileInput" accept=".txt,.log,.csv,text/plain" style="display:none">

<br><br>

<label>ログ入力：</label>
<textarea id="logInput"></textarea>

<br>

<label>対象日：</label>
<input type="date" id="targetDate">

<br><br>

<button id="calcBtn">ランキング作成</button>
<button id="copyBtn">コピー</button>
<span id="copyMsg" style="display:none;">コピーしました！</span>

<pre id="resultText"></pre>

<script src="script.js?v=20240605"></script>

</body>
</html>
